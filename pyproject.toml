[build-system]                    # tells pip HOW to build your project
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchcalm"               # provisional name until you pick the final one
version = "0.1.0"
description = "Prepare and restore a machine into a stable mode for software energy measurements"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []                 # THE policy line: stdlib-only, machine-checked in CI
authors = [{ name = "Jérôme Maquoi", email = "jerome.maquoi@unamur.be" }]
keywords = ["energy", "measurement", "RAPL", "reproducibility", "benchmarking"]

[project.scripts]                 # creates the CLI command on PATH
benchcalm = "benchcalm.cli:main"

[dependency-groups]               # dev-only, never installed on measurement machines
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]  # src/ layout: where the package lives
packages = ["src/benchcalm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]                 # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"